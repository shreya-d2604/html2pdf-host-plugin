[package]
name = "html2pdf-host-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "wasmcloud:html2pdf host plugin for wash-runtime: HTML to PDF in pure Rust with printpdf"
repository = "https://github.com/shreya-d2604/html2pdf-host-plugin"
publish = false

[dependencies]
# `wasmcloud-postgres` is not used here: at v2.12.0 it is the feature that
# pulls in `ulid`, which wash-runtime needs even with default features off.
wash-runtime = { git = "https://github.com/wasmCloud/wasmCloud", tag = "v2.12.0", default-features = false, features = ["wasmcloud-postgres"] }
printpdf = { version = "0.12.8", default-features = false, features = ["html"] }
anyhow = "1.0.98"
async-trait = "0.1"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
bytes = "1"
reqwest = { version = "0.12.20", default-features = false }
uuid = { version = "1.17.0", features = ["v4"] }
